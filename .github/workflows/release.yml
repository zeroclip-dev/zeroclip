name: Release

# Push a tag like v0.1.0 (it must match the version in Cargo.toml) to build and publish a release.
# Run by hand (workflow_dispatch) to only build and package: it uploads a workflow artifact and
# publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # sign the build provenance
      attestations: write # store the build provenance
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Read the Cargo version, and check the tag matches it
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $meta = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          $version = ($meta.packages | Where-Object name -eq 'zeroclip').version
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -ne "v$version") {
            throw "Tag $env:REF_NAME does not match the Cargo version v$version. Bump the version or retag."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Put fxc.exe on PATH (GPUI's shader build needs it)
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like '*\x64\*' } | Sort-Object FullName | Select-Object -Last 1
          if (-not $fxc) { throw 'fxc.exe not found' }
          Add-Content $env:GITHUB_PATH $fxc.DirectoryName

      - name: Build
        shell: pwsh
        # No build-machine paths in the exe: sources are remapped, and the PDB path recorded in the
        # exe is just its file name. The .pdb itself is never packaged.
        env:
          RUSTFLAGS: >-
            --remap-path-prefix=${{ github.workspace }}=zeroclip
            --remap-path-prefix=${{ runner.temp }}=tmp
            -C link-arg=/PDBALTPATH:%_PDB%
        run: cargo build --release --locked -p zeroclip

      # ffmpeg ships with the zip and as its own asset (the app downloads that one beside the exe
      # when ffmpeg is missing). Pinned gyan.dev "essentials" build: GPL, has libx264/libx265,
      # which the editor's exact cuts use. Bump URL and hash together.
      - name: Fetch ffmpeg (pinned, hash-checked)
        shell: pwsh
        env:
          FFMPEG_URL: https://github.com/GyanD/codexffmpeg/releases/download/9.1/ffmpeg-9.1-essentials_build.zip
          FFMPEG_SHA256: b9bbbb3acece000cbeec994f856649354e52c773807841e78908374b24d658fd
        run: |
          Invoke-WebRequest $env:FFMPEG_URL -OutFile ffmpeg-src.zip
          $hash = (Get-FileHash ffmpeg-src.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:FFMPEG_SHA256) { throw "ffmpeg download hash $hash does not match the pinned one" }
          Expand-Archive ffmpeg-src.zip ffmpeg-src
          $bin = (Get-ChildItem ffmpeg-src -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          $license = Get-ChildItem ffmpeg-src -Recurse -Filter LICENSE | Select-Object -First 1
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          Copy-Item "$bin/ffmpeg.exe", "$bin/ffprobe.exe", "$bin/ffplay.exe" ffmpeg/
          $source = "ffmpeg 9.1 essentials build by gyan.dev, licensed GPL v3.`nBuild: $env:FFMPEG_URL`nSource: https://ffmpeg.org/releases/ffmpeg-9.1.tar.xz and https://www.gyan.dev/ffmpeg/builds/`n`n"
          [IO.File]::WriteAllText("$PWD/ffmpeg/LICENSE-ffmpeg.txt", $source + (Get-Content $license.FullName -Raw))

      - name: Package and hash
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $base = "ZeroClip-v$env:VERSION-windows-x64"
          New-Item -ItemType Directory -Force dist, stage | Out-Null
          Copy-Item target/release/zeroclip.exe "dist/$base.exe"
          Copy-Item target/release/zeroclip.exe, LICENSE, README.md, ffmpeg/* stage/
          Compress-Archive -Path stage/* -DestinationPath "dist/$base.zip"
          # The app's installer expects exactly these names at the zip's root (update::FFMPEG_ASSET).
          Compress-Archive -Path ffmpeg/* -DestinationPath dist/ffmpeg-windows-x64.zip
          # The installer: per-user, same files as the zip (installer/zeroclip.iss).
          choco install innosetup --no-progress -y | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$env:VERSION" installer/zeroclip.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          # sha256sum format: "<lowercase hex>  <file name>", LF line endings, no BOM.
          $lines = Get-ChildItem dist -File | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object Name |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", ($lines -join "`n") + "`n")
          Get-Content dist/SHA256SUMS.txt

      - name: Attest build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip

      - name: Publish the release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:TAG dist/* --repo $env:GITHUB_REPOSITORY --title $env:TAG --generate-notes --verify-tag

      - name: Keep the files (manual runs only)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dist
          path: dist/*
          retention-days: 7
